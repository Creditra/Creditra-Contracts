[package]
name = "creditra-freeze"
version = "0.1.0"
edition = "2021"
description = "Creditra freeze auth-boundary integration tests (test/indexer support crate, not deployable)"
license = "MIT"
keywords = ["soroban", "stellar", "freeze", "credit"]
categories = ["cryptography::cryptocurrencies", "finance", "no-std"]
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
creditra-credit = { path = "../credit" }

[[test]]
name = "auth_boundary"
path = "tests/auth_boundary.rs"

[[test]]
name = "events"
path = "tests/events.rs"

[[test]]
name = "auth_snap"
path = "tests/auth_snap.rs"

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
creditra-credit = { path = "../credit", features = [] }
