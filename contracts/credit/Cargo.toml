[package]
name = "creditra-credit"
version = "0.1.0"
edition = "2021"
description = "Creditra credit line Soroban contract"
license = "MIT"
keywords = ["soroban", "stellar", "credit", "defi", "smart-contract"]
categories = ["cryptography::cryptocurrencies", "finance", "no-std"]
readme = "../../README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Host-side per-entrypoint budget instrumentation (tests, examples, CI gas regression).
instrument = ["dep:serde", "dep:serde_json", "dep:gateway-auction", "soroban-sdk/testutils"]
# Re-enables the O(N) conservation recomputation on the "hot" accumulator
# paths for integration tests and invariant harnesses (Issue #1269).
# Never enable this in a production/WASM build: the full scan is O(credit-line
# count) and would reintroduce the DoS it was removed to fix.
invariants = []

[dependencies]
# `alloc` provides the WASM global allocator required because math_utils uses
# `alloc::vec` (heap allocation) in the no_std contract build.
soroban-sdk = { workspace = true, features = ["alloc"] }
serde = { version = "1.0", optional = true, default-features = false, features = ["derive"] }
serde_json = { version = "1.0", optional = true, default-features = false }
# Host-only auction harness used by `src/instrument.rs` under the `instrument`
# feature. Declared as an optional normal dependency (not only a dev-dependency)
# because `instrument.rs` is part of the library crate.
gateway-auction = { path = "../../gateway-contract/contracts/auction_contract", optional = true }

[[example]]
name = "budget_baseline"
required-features = ["instrument"]

[[test]]
name = "budget_regression"
path = "tests/budget_regression.rs"
required-features = ["instrument"]

[[test]]
name = "instrument"
path = "tests/instrument.rs"
required-features = ["instrument"]

[[test]]
name = "risk_gas_snap"
path = "tests/risk_gas_snap.rs"

[[test]]
name = "risk_admin_cooldown"
path = "tests/risk_admin_cooldown.rs"

[dev-dependencies]
gateway-auction = { path = "../../gateway-contract/contracts/auction_contract" }
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "=1.3.1"
# U256 reference arithmetic for the math_utils::mul_div property test.
primitive-types = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
insta = "1.40"
