[package]
name = "creditra-collateral"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[[test]]
name = "catalog"
path = "tests/catalog.rs"

[[test]]
name = "err_stab"
path = "tests/err_stab.rs"
