name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Reproducible builds: resolve dependencies strictly from the committed
  # Cargo.lock. Any drift (manifest edit without lock refresh) fails the build
  # instead of silently picking new dependency versions.
  CARGOFLAGS: --locked

jobs:
  contract:
    name: Creditra credit contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Single source of truth: the exact channel pinned in
      # rust-toolchain.toml. Do not hardcode versions here and do not use
      # floating channel refs for the toolchain action — both are rejected
      # by scripts/check-toolchain.sh so local and CI builds cannot diverge.
      - name: Read pinned toolchain channel
        id: toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n1)"
          if [[ -z "$channel" ]]; then
            echo "::error::Could not read the pinned channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Pinned toolchain channel: $channel"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      # Fail fast — before any compile — if the runner's active toolchain,
      # lock files, or the workflow itself drift from the reproducible-build
      # policy (e.g. a stray rustup override or an uncommitted Cargo.lock).
      - name: Verify reproducible-build policy
        run: scripts/check-toolchain.sh --verify-active --lock contracts/creditra-credit/Cargo.lock

      - name: Validate generated contract interfaces
        run: scripts/validate_schemas.sh

      # The reproducible-build guard scripts are the enforcement layer for the
      # pinned-toolchain policy. Run their own test suites so a regression in
      # the guards themselves fails CI, not just a regression in the contracts.
      # (Bash-only, no Rust toolchain required.)
      - name: Test reproducible-build guard scripts
        run: |
          set -euo pipefail
          scripts/test_check_toolchain.sh
          scripts/test_check_wasm_size.sh

      - name: Print toolchain versions
        run: |
          rustc --version
          cargo --version
          rustup target list --installed

      - name: Check formatting
        working-directory: contracts/creditra-credit
        run: cargo fmt -- --check

      - name: Run clippy
        working-directory: contracts/creditra-credit
        run: cargo clippy $CARGOFLAGS --all-targets -- -D warnings

      - name: Run tests
        working-directory: contracts/creditra-credit
        run: cargo test $CARGOFLAGS --no-fail-fast

      - name: Build native release
        working-directory: contracts/creditra-credit
        run: cargo build $CARGOFLAGS --release

      - name: Build WASM release
        working-directory: contracts/creditra-credit
        env:
          RUSTFLAGS: -C link-arg=--allow-undefined
        # Build only the library for the wasm target so host-side binaries
        # (e.g. the `schema` generator) are not compiled for wasm. This
        # prevents host-only macros and traits from being evaluated for the
        # wasm build and avoids CI failures when building the artifact.
        run: cargo build $CARGOFLAGS --release --lib --target wasm32-unknown-unknown

      # Enforce the artifact size budget with the same scanner the guard tests
      # exercise (scripts/check-wasm-size.sh), so CI and local policy checks
      # share one implementation. Threshold is unchanged at 614,400 bytes.
      - name: Verify WASM artifact
        env:
          THRESHOLD_BYTES: "614400"
          WASM_DIR: contracts/creditra-credit/target/wasm32-unknown-unknown/release
        run: scripts/check-wasm-size.sh --check-only

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: creditra-credit-wasm
          path: contracts/creditra-credit/target/wasm32-unknown-unknown/release/creditra_credit.wasm
          if-no-files-found: error
