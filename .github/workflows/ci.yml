name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Creditra credit contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/creditra-credit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run tests
        run: cargo test --no-fail-fast

      - name: Build native release
        run: cargo build --release

      - name: Build WASM release
        env:
          RUSTFLAGS: -C link-arg=--allow-undefined
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Verify WASM artifact
        run: |
          set -euo pipefail
          wasm_path="target/wasm32-unknown-unknown/release/creditra_credit.wasm"
          test -f "$wasm_path"
          size_bytes=$(stat -c '%s' "$wasm_path")
          echo "WASM size: ${size_bytes} bytes"
          test "$size_bytes" -le 614400
