[toolchain]
# Pinned exact version — the single source of truth for every local and CI
# build. Floating channels (`stable`, `beta`, `nightly`) are rejected by
# `scripts/check-toolchain.sh` because they make builds irreproducible across
# machines and over time. Bump this value deliberately and in the same commit
# as any toolchain-behavior-sensitive baseline (e.g. WASM size budgets).
channel = "1.97.1"
targets = ["wasm32-unknown-unknown"]
# `llvm-tools` supplies the `llvm-profdata` / `llvm-cov` binaries that
# cargo-llvm-cov shells out to. Declaring it here keeps the coverage numbers CI
# enforces byte-for-byte comparable with the ones a local run produces: both
# sides profile the same pinned compiler. Without it, a contributor measuring
# locally with a different LLVM would silently compute a different denominator.
components = ["rustfmt", "clippy", "llvm-tools"]
