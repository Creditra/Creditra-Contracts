[package]
name = "creditra-query"
version = "0.1.0"
edition = "2021"
description = "Creditra query v7 — per-entrypoint gas snapshot and invariant proptest"
license = "MIT"
keywords = ["soroban", "stellar", "query", "credit", "smart-contract"]
categories = ["cryptography::cryptocurrencies", "finance", "no-std"]
readme = "../../README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
creditra-credit = { path = "../credit" }

[[test]]
name = "gas_snap"
path = "tests/gas_snap.rs"

[[test]]
name = "proptest"
path = "tests/proptest.rs"

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
creditra-credit = { path = "../credit", features = [] }
proptest = "1.4"
