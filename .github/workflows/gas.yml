name: Gas Regression

on:
  push:
    branches: [main, master, develop, "feature/**"]
  pull_request:
    branches: [main, master, develop]

defaults:
  run:
    shell: bash

concurrency:
  group: gas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  budget-regression:
    name: Budget regression (≤5% drift)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-gas-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gas-

      - name: Stage committed baseline as snapshot
        run: |
          mkdir -p contracts/credit/test_snapshots
          cp contracts/.gas-baseline.json contracts/credit/test_snapshots/budget.json
          echo "=== Committed baseline entries ==="
          cat contracts/credit/test_snapshots/budget.json | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          print(f'Entries: {len(data)}')
          for b in data:
              print(f'  {b[\"entrypoint\"]:32s}  cpu={b[\"cpu_instructions\"]:>8}  mem={b[\"memory_bytes\"]:>8}  (tol ±{b.get(\"tolerance_pct\",5.0)}%)')
          "

      - name: Run instrument validation
        run: |
          cargo test --manifest-path contracts/credit/Cargo.toml --features instrument --test instrument -- --nocapture

      - name: Run budget regression gate (fail on >5% drift)
        run: |
          cargo test --manifest-path contracts/credit/Cargo.toml --features instrument --test budget_regression -- --nocapture
