[package]
name = "creditra-query"
version = "0.1.0"
edition = "2021"
description = "Creditra query (v7) error stability tests — freezes client-facing error codes for query entrypoints"
license = "MIT"
keywords = ["soroban", "stellar", "query", "credit", "smart-contract"]
categories = ["cryptography::cryptocurrencies", "finance", "no-std"]
readme = "../../README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
creditra-credit = { path = "../credit" }

[[test]]
name = "err_stab"
path = "tests/err_stab.rs"

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
creditra-credit = { path = "../credit", features = [] }
