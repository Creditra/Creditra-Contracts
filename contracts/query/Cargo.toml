[package]
name = "creditra-query"
version = "0.1.0"
edition = "2021"
description = "Creditra query (v7) structured events, capabilities view, and error stability tests"
license = "MIT"
keywords = ["soroban", "stellar", "query", "credit", "smart-contract"]
categories = ["cryptography::cryptocurrencies", "finance", "no-std"]
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
creditra-credit = { path = "../credit" }

[[test]]
name = "err_stab"
path = "tests/err_stab.rs"

[[test]]
name = "events"
path = "tests/events.rs"

[[test]]
name = "capabilities"
path = "tests/capabilities.rs"

[[test]]
name = "rustdoc_query_tests"
path = "tests/rustdoc_query_tests.rs"

[[test]]
name = "proptest"
path = "tests/proptest.rs"

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
creditra-credit = { path = "../credit", features = [] }
proptest = "=1.3.1"
