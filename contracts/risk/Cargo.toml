[package]
name = "creditra-risk"
version = "0.1.0"
edition = "2021"
description = "Creditra risk admin cooldown contract for GrantFox FWC26 campaign"
license = "MIT"
keywords = ["soroban", "stellar", "risk", "admin", "cooldown"]
categories = ["cryptography::cryptocurrencies", "finance", "no-std"]
readme = "../../README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
serde = { version = "1.0", optional = true, default-features = false, features = ["derive"] }
serde_json = { version = "1.0", optional = true, default-features = false }

[features]
instrument = ["dep:serde", "dep:serde_json", "soroban-sdk/testutils"]

[[test]]
name = "risk_admin_cooldown"
path = "tests/risk_admin_cooldown.rs"
required-features = ["instrument"]

[[test]]
name = "rustdoc_risk_tests"
path = "tests/rustdoc_risk_tests.rs"

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proptest = "=1.3.1"
[[test]]
name = "ttl_bump"
path = "tests/ttl_bump.rs"
