[toolchain]
# Pinned exact version — the single source of truth for every local and CI
# build. Floating channels (`stable`, `beta`, `nightly`) are rejected by
# `scripts/check-toolchain.sh` because they make builds irreproducible across
# machines and over time. Bump this value deliberately and in the same commit
# as any toolchain-behavior-sensitive baseline (e.g. WASM size budgets).
channel = "1.97.1"
targets = ["wasm32-unknown-unknown"]
# llvm-tools-preview supplies the LLVM profile runtime that `cargo llvm-cov`
# links into instrumented test binaries. It is declared here, alongside
# rustfmt/clippy, so the coverage job and a local `cargo llvm-cov` run resolve
# the same runtime as the pinned toolchain.
components = ["rustfmt", "clippy", "llvm-tools-preview"]
