[package]
name = "creditra-credit"
version = "0.1.0"
edition = "2021"
description = "Credit line management contract with draw audit trail"

# Standalone package; not a member of the Soroban root workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Host-side per-entrypoint CPU-time instrumentation (tests, regression baselines).
instrument = ["dep:serde_json"]

[dependencies]
cosmwasm-std = { version = "2", features = ["staking", "iterator"] }
cosmwasm-schema = "2"
cw-storage-plus = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
schemars = "0.8"
thiserror = "2"

[profile.release]
opt-level = "z"
overflow-checks = false
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[dev-dependencies]
proptest = "1.4"
serde_json = "1"

[[test]]
name = "instrument"
path = "tests/instrument.rs"
required-features = ["instrument"]

[[test]]
name = "cpu_regression"
path = "tests/cpu_regression.rs"
required-features = ["instrument"]

[[example]]
name = "cpu_baseline"
required-features = ["instrument"]
